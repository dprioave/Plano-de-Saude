   RENDER — VIEW: MÓDULO (Saúde / Odonto)
============================================================ */
function renderCompTabs(modulo, todasComps, sel){
  if(todasComps.length<=1) return "";
  return `
  <div class="comp-tabs">
    ${todasComps.slice().reverse().map(c=>{
      const projetada = !state.modulos[modulo].faturas[c];
      return `<button class="comp-tab ${c===sel?'active':''} ${projetada?'projetado':''}" data-comp="${c}" data-modulo="${modulo}" title="${projetada?'Projeção — só parcelas em aberto, nenhuma fatura importada ainda':''}">${mesLabelCurto(c)}</button>`;
    }).join("")}
  </div>`;
}
function renderCoparticipacaoPanel(modulo, sel, copart){
  return `
  <div class="panel">
    <div class="panel-head">
      <div class="ph-text"><h3>Coparticipação por beneficiário (base para desconto em folha)</h3><p>Um beneficiário acima de R$ 100,00 pode parcelar (escolha do funcionário, até o teto da tabela) — o valor de parcelamentos ainda em aberto de meses anteriores é somado automaticamente ao total deste mês.</p></div>
      <label class="btn ghost" for="fileHistorico" style="white-space:nowrap">${ICONS.upload}Importar planilha histórica</label>
      <input type="file" id="fileHistorico" accept=".xlsx,.xls">
    </div>
    ${copart.length ? `
    <div class="twrap"><table><thead><tr><th>Beneficiário</th><th>Vínculo</th><th class="num">Valor novo (${mesLabelCurto(sel)})</th><th>Parcelas</th><th class="num">Valor da parcela</th><th class="num">Total a descontar</th><th></th></tr></thead><tbody>
      ${copart.map(r=>{
        const novo = r.origens.find(o=>o.ehNovo);
        const outras = r.origens.filter(o=>!o.ehNovo);
        const faixa = novo ? faixaParcelamento(novo.valorTotal) : null;
        return `<tr>
        <td>${titleCase(r.beneficiario.nome)}</td>
        <td>
          <span class="pill ${r.beneficiario.parentesco?'dep':'titular'}">${r.beneficiario.parentesco?depLabel(r.beneficiario.parentesco):'Titular'}</span>
          ${r.beneficiario.parentesco && r.titular ? `<div class="muted" style="font-size:11px;margin-top:3px">titular: ${titleCase(r.titular.nome)}</div>` : ""}
        </td>
        <td class="num tabular">${novo ? fmtBRL(novo.valorTotal) : "—"}</td>
        <td>${novo ? `
          <input type="number" class="input-parcelas" min="1" max="${faixa.max}" value="${novo.parcelas}"
            data-parcelas-nome="${encodeURIComponent(r.nomeNorm)}" data-parcelas-comp="${novo.competencia}" data-parcelas-modulo="${modulo}"
            style="width:56px;text-align:center">
          <div class="muted" style="font-size:10.5px;margin-top:2px">${faixa.label}</div>
        ` : `<span class="muted">—</span>`}</td>
        <td class="num tabular">${novo ? fmtBRL(novo.valorParcela) : "—"}</td>
        <td class="num tabular" style="color:var(--warn);font-weight:600">
          ${fmtBRL(r.totalDescontar)}
          ${r.acumuladoDaPlanilha
            ? `<div class="muted" style="font-size:10.5px;font-weight:400">acumulado da planilha${novo && r.acumuladoSaldoAnterior>0.005 ? ` (parcela de ${mesLabelCurto(sel)}: ${fmtBRL(novo.valorParcela)} + saldo anterior: ${fmtBRL(r.acumuladoSaldoAnterior)})` : ""}</div>`
            : (outras.length ? `<div class="muted" style="font-size:10.5px;font-weight:400">${outras.map(o=>`+ ${fmtBRL(o.valorParcela)} (${mesLabelCurto(o.competencia)}, parcela até ${mesLabelCurto(o.ultima)})`).join("<br>")}</div>` : "")}
        </td>
        <td><button class="btn ghost" data-hist="${encodeURIComponent(r.nomeNorm)}">${ICONS.history}Histórico</button></td>
      </tr>`;}).join("")}
    </tbody></table></div>
    ` : `<div class="empty">Nenhuma coparticipação ativa neste mês.</div>`}
  </div>`;
}
function renderModulo(modulo){
  const isHealth = modulo === "saude";
  const label = isHealth ? "Saúde" : "Odonto";
  const compsReais = competenciasDisponiveis(modulo);
  const compsProjetadas = isHealth ? competenciasProjetadas(modulo) : [];
  const todasComps = [...compsReais, ...compsProjetadas];
  const sel = state["_sel_"+modulo] || compsReais[compsReais.length-1] || compsProjetadas[0] || null;
  const fatura = sel ? state.modulos[modulo].faturas[sel] : null;

  const uploader = `
    <label class="uploader" for="fileFatura_${modulo}">
      <div class="uicon">${ICONS.upload}</div>
      <div class="ux"><strong>Importar fatura de ${label} (PDF)</strong><span>Fatura técnica Bradesco — pode selecionar vários meses de uma vez, o mês de cada um é detectado automaticamente. Leitura feita no navegador, nada é enviado a servidores.</span></div>
    </label>
    <input type="file" id="fileFatura_${modulo}" accept="application/pdf" multiple>
  `;

  if(!todasComps.length){
    return `
    <div class="view-head">
      <div><h2>${label}</h2><p>Importe a fatura mensal em PDF para ver beneficiários${isHealth?', coparticipação':''} e possíveis desligados ainda no plano.</p></div>
    </div>
    <div class="empty-state panel">
      <div class="es-icon">${isHealth?ICONS.heart:ICONS.tooth}</div>
      <h4>Nenhuma fatura de ${label.toLowerCase()} importada</h4>
      <div style="max-width:420px;margin:0 auto 4px">${uploader}</div>
    </div>`;
  }

  if(!fatura){
    // competência projetada: sem fatura real pra esse mês, só mostra as parcelas de meses anteriores ainda em aberto
    const copart = isHealth ? coparticipacaoDoMes(modulo, sel) : [];
    return `
    ${renderCompTabs(modulo, todasComps, sel)}
    <div class="view-head">
      <div><h2>${label}</h2><p>Projeção de ${fmtCompetencia(sel)} — nenhuma fatura importada ainda para este mês. Os valores abaixo são só das parcelas de coparticipação de meses anteriores que ainda continuam em aberto.</p></div>
      <div class="head-actions">
        <label class="btn" for="fileFatura_${modulo}">${ICONS.upload}Importar fatura deste mês</label>
        <input type="file" id="fileFatura_${modulo}" accept="application/pdf" multiple>
      </div>
    </div>
    ${isHealth ? renderCoparticipacaoPanel(modulo, sel, copart) : ""}
    `;
  }

  if(!fatura.eventos){
    // competência vinda da planilha histórica (sem PDF real) — só dá pra mostrar a coparticipação
    const copart = coparticipacaoDoMes(modulo, sel);
    return `
    ${renderCompTabs(modulo, todasComps, sel)}
    <div class="view-head">
      <div><h2>${label}</h2><p>Dados de ${fmtCompetencia(sel)} importados da planilha histórica — sem o PDF da fatura desse mês não dá pra conferir desligados, divergências de empresa ou a lista completa de beneficiários.</p></div>
      <div class="head-actions">
        <label class="btn" for="fileFatura_${modulo}">${ICONS.upload}Importar fatura real deste mês</label>
        <input type="file" id="fileFatura_${modulo}" accept="application/pdf" multiple>
      </div>
    </div>
    ${renderCoparticipacaoPanel(modulo, sel, copart)}
    `;
  }

  const analise = analisarTitulares(fatura, modulo);
  const desl = analise.desligados;
  const pendentes = analise.pendentes;
  const divEmpresa = analise.divergenciasEmpresa;
  const titulares = titularesDaFatura(fatura);
  const copart = isHealth ? coparticipacaoDoMes(modulo, sel) : [];
  const valorLiquidoMap = valorLiquidoPorCertificado(fatura);

  const empresasDisp = empresasNaFatura(fatura, modulo);
  const filtro = state["_filtroEmpresa_"+modulo] || "";
  const passaFiltro = empresa => !filtro || empresaOuGrupo(empresa, modulo) === filtro;
  const deslF = desl.filter(d=>passaFiltro(d.empresa));
  const pendentesF = pendentes.filter(p=>passaFiltro(p.titular.empresa));
  const divEmpresaF = divEmpresa.filter(d=>passaFiltro(d.titular.empresa));
  const titularesF = titulares.filter(t=>passaFiltro(t.empresa));
  const copartF = copart.filter(r=>passaFiltro(r.beneficiario.empresa));
  const beneficiariosF = fatura.beneficiarios.filter(b=>!b.ajusteOnly && passaFiltro(b.empresa));
  const totalCopart = copartF.reduce((s,r)=>s+r.totalDescontar,0);
  const totalEventosF = fatura.eventos.filter(e=>passaFiltro(e.empresa)).length;
  // Valor líquido (não a coluna "Valor" crua) — já desconta estornos/cancelamentos retroativos
  // (CM/CR), mesma lógica já usada na tabela de desligados e no rateio por centro de custo.
  const totalMensalidade = beneficiariosF.reduce((s,b)=> s + (valorLiquidoMap.get((b.empresa||"")+"|"+b.certificado) ?? (b.valor||0)), 0);

  return `
  ${renderCompTabs(modulo, todasComps, sel)}
  <div class="view-head">
    <div>
      <h2>${label}</h2>
      <p>Fatura ${fmtCompetencia(fatura.competencia)} · ${(fatura.arquivos||[]).length} arquivo(s): ${(fatura.arquivos||[]).map(a=>a.nome).join(", ")||"—"}</p>
    </div>
    <div class="head-actions">
      ${empresasDisp.length>1 ? `<select id="filtroEmpresa_${modulo}"><option value="">Todas as empresas</option>${empresasDisp.map(e=>`<option value="${e}" ${e===filtro?'selected':''}>${e}</option>`).join("")}</select>` : ""}
      <label class="btn" for="fileFatura_${modulo}">${ICONS.upload}Importar nova fatura</label>
      <input type="file" id="fileFatura_${modulo}" accept="application/pdf" multiple>
    </div>
  </div>

  <div class="tiles">
    <div class="tile"><div class="tlabel">Titulares na fatura</div><div class="tval tabular">${titularesF.length}</div></div>
    <div class="tile"><div class="tlabel">Beneficiários totais</div><div class="tval tabular">${beneficiariosF.length}</div><div class="tsub">titulares + dependentes</div></div>
    <div class="tile ${pendentesF.length?'warn':''}"><div class="tlabel">Nomes a confirmar</div><div class="tval tabular">${pendentesF.length}</div><div class="tsub">grafia parecida no cadastro</div></div>
    <div class="tile ${divEmpresaF.length?'warn':''}"><div class="tlabel">Empresa divergente</div><div class="tval tabular">${divEmpresaF.length}</div><div class="tsub">fatura ≠ cadastro</div></div>
    <div class="tile ${deslF.length?'danger':'ok'}"><div class="tlabel">Desligados ainda no plano</div><div class="tval tabular">${deslF.length}</div></div>
    <div class="tile"><div class="tlabel">Valor da mensalidade</div><div class="tval tabular">${fmtBRL(totalMensalidade)}</div><div class="tsub">${beneficiariosF.length} beneficiário(s), líquido de estornos</div></div>
    ${isHealth ? `<div class="tile warn"><div class="tlabel">Coparticipação do mês</div><div class="tval tabular">${fmtBRL(totalCopart)}</div><div class="tsub">${totalEventosF} evento(s)</div></div>` : ""}
  </div>

  ${pendentesF.length ? `
  <div class="panel">
    <div class="panel-head">
      <div class="ph-text">
        <h3>${ICONS.alert.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" style="width:15px;height:15px;vertical-align:-2px;margin-right:4px;color:var(--warn)"')}Nomes parecidos a confirmar</h3>
        <p>Não achei o nome exato do titular no cadastro de ativos, mas há um nome bem parecido — pode ser a mesma pessoa grafada diferente (nome do meio, abreviação, acento). Confirme cada um.</p>
      </div>
    </div>
    <div class="twrap"><table><thead><tr><th>Nome na fatura</th><th>Nome parecido no cadastro</th><th class="num">Parecença</th><th>Empresa (subfatura)</th><th></th></tr></thead><tbody>
      ${pendentesF.map(p=>`<tr>
        <td>${titleCase(p.titular.nome)}</td>
        <td class="muted">${titleCase(p.sugestao.nome)} <span class="muted">— ${p.sugestao.empresaNome||""}</span></td>
        <td class="num tabular">${Math.round(p.score*100)}%</td>
        <td class="muted">${p.titular.empresa||"—"}</td>
        <td style="display:flex;gap:6px;white-space:nowrap;flex-wrap:wrap">
          <button class="btn ghost" data-resolve="mesmo" data-nome="${encodeURIComponent(p.titular.nomeNorm)}" data-ativo="${encodeURIComponent(p.sugestao.nome)}">É o mesmo</button>
          <button class="btn ghost" data-resolve="naoClt" data-nome="${encodeURIComponent(p.titular.nomeNorm)}">Não é CLT</button>
          <button class="btn ghost" data-resolve="diferente" data-nome="${encodeURIComponent(p.titular.nomeNorm)}">É desligado</button>
        </td>
      </tr>`).join("")}
    </tbody></table></div>
  </div>` : ""}

  ${divEmpresaF.length ? `
  <div class="panel">
    <div class="panel-head">
      <div class="ph-text">
        <h3>${ICONS.alert.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" style="width:15px;height:15px;vertical-align:-2px;margin-right:4px;color:var(--warn)"')}Funcionário na fatura de outra empresa</h3>
        <p>O titular está no plano, mas na subfatura de uma empresa diferente da que consta hoje no cadastro de ativos — provável transferência entre empresas do grupo sem atualizar o plano.</p>
      </div>
    </div>
    <div class="twrap"><table><thead><tr><th>Titular</th><th>Empresa na fatura</th><th>Empresa no cadastro</th><th></th></tr></thead><tbody>
      ${divEmpresaF.map(d=>`<tr>
        <td>${titleCase(d.titular.nome)}</td>
        <td class="muted">${d.titular.empresa||"—"}</td>
        <td class="muted">${d.empresaEsperada||d.ativo.empresaNome||"—"}</td>
        <td><button class="btn ghost" data-empresa-ciente="${encodeURIComponent(d.titular.nomeNorm)}">Ciente</button></td>
      </tr>`).join("")}
    </tbody></table></div>
  </div>` : ""}

  <div class="panel">
    <div class="panel-head">
      <div class="ph-text">
        <h3>${ICONS.alert.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" style="width:15px;height:15px;vertical-align:-2px;margin-right:4px;color:var(--danger)"')}Funcionários desligados ainda no plano</h3>
        <p>Titulares que aparecem na fatura mas não estão na lista de ativos importada (sem nenhum nome parecido no cadastro, ou já confirmados como desligados). "Valor líquido no mês" já soma os estornos/cancelamentos retroativos (linhas CM/CR) — quando fica zero ou negativo, a operadora já está estornando os meses cobrados, ou seja, o cancelamento já está em processamento; um valor positivo é o caso realmente pendente. Não vale pra diretor/sócio/pro-labore, que não entra no export de CLT.</p>
      </div>
    </div>
    ${deslF.length ? `
    <div class="twrap"><table><thead><tr><th>Titular</th><th>Empresa (subfatura)</th><th>Certificado</th><th>Início no plano</th><th class="num">Valor líquido no mês</th><th>Situação</th><th></th></tr></thead><tbody>
      ${deslF.map(d=>{
        const liquido = valorLiquidoMap.get((d.empresa||"")+"|"+d.certificado) ?? d.valor;
        const cancelamentoEmAndamento = liquido <= 0.005 && liquido !== d.valor;
        return `<tr>
        <td>${titleCase(d.nome)}</td>
        <td class="muted">${d.empresa||"—"}</td>
        <td class="tabular muted">${d.certificado}</td>
        <td class="tabular">${fmtDateISO(d.dataInicio)}</td>
        <td class="num tabular" style="${liquido<0?'color:var(--ok)':''}">${fmtBRL(liquido)}</td>
        <td>${cancelamentoEmAndamento ? `<span class="pill ok">Cancelamento em processamento</span>` : `<span class="pill danger">Pendente</span>`}</td>
        <td><button class="btn ghost" data-resolve="naoClt" data-nome="${encodeURIComponent(d.nomeNorm)}">Não é CLT (diretor/sócio)</button></td>
      </tr>`;}).join("")}
    </tbody></table></div>
    ` : `<div class="empty">Nenhum desligado encontrado nesta fatura.</div>`}
  </div>

  ${isHealth ? renderCoparticipacaoPanel(modulo, sel, copartF) : `
  <div class="panel">
    <h3>Beneficiários</h3>
    <p class="phint">O odontológico é cobrado em valor fixo por beneficiário — esta fatura não trouxe eventos de coparticipação por procedimento.</p>
  </div>
  `}

  <div class="panel">
    <div class="panel-head">
      <div class="ph-text"><h3>Todos os beneficiários</h3><p>${titularesF.length} titulares na fatura de ${fmtCompetencia(fatura.competencia)}${filtro?` — filtrado por ${filtro}`:""}.</p></div>
      <button class="btn ghost" id="btnExportBenef" style="white-space:nowrap">${ICONS.download}Extrair em Excel</button>
    </div>
    <div class="twrap"><table><thead><tr><th>Nome</th><th>Vínculo</th><th>Empresa</th><th>Plano</th><th class="num">Valor</th></tr></thead><tbody>
      ${beneficiariosF.slice(0,400).map(b=>`<tr>
        <td>${titleCase(b.nome)}</td>
        <td><span class="pill ${b.parentesco?'dep':'titular'}">${b.parentesco?depLabel(b.parentesco):'Titular'}</span></td>
        <td class="muted">${b.empresa||"—"}</td>
        <td class="tabular muted">${b.plano||"—"}</td>
        <td class="num tabular">${fmtBRL(b.valor)}</td>
      </tr>`).join("")}
    </tbody></table></div>
    ${beneficiariosF.length>400 ? `<p class="phint" style="margin-top:10px">Mostrando os primeiros 400 registros.</p>` : ""}
  </div>
  `;
}

const EXPORT_NAVY = "FF16232E", EXPORT_TEAL = "FF5FB4AE", EXPORT_HEADER_FILL = "FFEEF1F2",
    EXPORT_HEADER_TEXT = "FF24384A", EXPORT_SUBTITLE_TEXT = "FF6B7378", EXPORT_BODY_TEXT = "FF2A2A2A",
    EXPORT_ZEBRA = "FFF6F7F7", EXPORT_TOTALS_FILL = "FFE7F3F1", EXPORT_FONT = "Aptos";
async function saveFile(filename, blob){
  let downloads = null;
  try{ if(window.claude && window.claude.use) downloads = await window.claude.use("downloads"); }catch(e){ downloads = null; }
  if(downloads){
    try{ await downloads.save({filename, data:blob}); return; }
    catch(e){ if(e && e.code==="declined") return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function periodoLabel(){ return new Date().toLocaleDateString("pt-BR"); }
function buildExportHeader(ws, titulo, subtitulo, infoLine, lastCol){

  ws.getRow(1).height = 6;

  ws.getRow(2).height = 24;

  const s = ws.getCell(3,2);

function montarSheetBeneficiarios(wb, modulo, competencia, sheetName, centrosDisponiveis){
  const fatura = competencia ? state.modulos[modulo].faturas[competencia] : null;
  if(!fatura || !fatura.beneficiarios) return null;
  const label = modulo === "saude" ? "Saúde" : "Odonto";
  const filtro = state["_filtroEmpresa_"+modulo] || "";
  const linhas = rateioBeneficiarios(modulo, competencia)
    .filter(l => !filtro || empresaOuGrupo(l.beneficiario.empresa, modulo) === filtro)
    .sort((a,b)=>{
      // ordem alfabética pelo TITULAR (não pelo nome da própria linha), com o titular sempre antes
      // dos seus dependentes dentro do mesmo grupo — pedido explícito do usuário.
      const cmpTitular = a.titular.nome.localeCompare(b.titular.nome, "pt-BR");
      if(cmpTitular !== 0) return cmpTitular;
      const aEhTitular = !a.beneficiario.parentesco, bEhTitular = !b.beneficiario.parentesco;
      if(aEhTitular !== bEhTitular) return aEhTitular ? -1 : 1;
      return a.beneficiario.nome.localeCompare(b.beneficiario.nome, "pt-BR");
    });
  if(!linhas.length) return null;

  const ws = wb.addWorksheet(sheetName);
  const sel = competencia;
  const cols = ["Nome","Vínculo","Empresa (subfatura)","Departamento (titular)","Centro de custo","Mensalidade","IOF (rateado)","Coparticipação do mês","Total rateado"];
  const widths = [28,12,30,24,40,13,13,18,14];
  const FIRST_COL = 2, lastCol = FIRST_COL + cols.length - 1;
  const CC_COL = FIRST_COL + 4;

  const totalMens = linhas.reduce((s,l)=>s+l.mensalidade,0);
  const totalIof = linhas.reduce((s,l)=>s+l.iof,0);
  const totalCopart = linhas.reduce((s,l)=>s+l.coparticipacaoMes,0);
  const totalGeral = totalMens + totalIof + totalCopart;
  const naoMapeados = linhas.filter(l=>!l.centroCusto).length;
  // Confere o total rateado contra o(s) boleto(s) reais dos arquivos presentes — mesma checagem
  // "Diferença" que a planilha de conferência da Rio Ave já faz, agora automática. Nota: se o filtro
  // de empresa estiver ativo e a empresa filtrada compartilhar um boleto com outras subfaturas do
  // mesmo arquivo (caso dos boletos consolidados), o boleto mostrado é o do arquivo inteiro, não só
  // da empresa filtrada — por isso a diferença só é 0 exato sem filtro, ou filtrando por uma empresa
  // cujo arquivo cobre só ela.
  const arquivosNoRateio = [...new Set(linhas.map(l=>l.beneficiario.origemArquivo))];
  const totalBoletos = arquivosNoRateio.reduce((s,arq)=> s + ((fatura.boletoPorArquivo||{})[arq]||0), 0);
  const temBoletos = arquivosNoRateio.some(arq=>(fatura.boletoPorArquivo||{})[arq]!=null);
  const diferenca = temBoletos ? (totalGeral - totalBoletos) : null;
  const headerRow = buildExportHeader(ws, `PLANO DE ${label.toUpperCase()} — TODOS OS BENEFICIÁRIOS`,
    `Competência: ${fmtCompetencia(sel)}${filtro?` · Empresa: ${filtro}`:""} · Gerado em ${periodoLabel()}`,
    `Beneficiários: ${linhas.length}  |  Mensalidade: ${fmtBRL(totalMens)}  |  IOF: ${fmtBRL(totalIof)}  |  Coparticipação: ${fmtBRL(totalCopart)}  |  Total: ${fmtBRL(totalGeral)}` +
    (temBoletos ? `  |  Boleto(s): ${fmtBRL(totalBoletos)}  |  Diferença: ${fmtBRL(diferenca)}` : "") +
    (naoMapeados?`  |  ${naoMapeados} sem centro de custo mapeado`:""),
    lastCol);

  ws.getColumn(1).width = 1.8;
  cols.forEach((c,i)=> ws.getColumn(FIRST_COL+i).width = widths[i]);
  cols.forEach((c,i)=> ws.getCell(headerRow, FIRST_COL+i).value = c);
  styleExportHeaderRow(ws, headerRow, FIRST_COL, lastCol);

  let r = headerRow;
  linhas.forEach((l,idx)=>{
    r++;
    const vals = [
      titleCase(l.beneficiario.nome),
      l.beneficiario.parentesco ? depLabel(l.beneficiario.parentesco) : "Titular",
      l.beneficiario.empresa || "—",
      (l.ativo && l.ativo.departamento) ? titleCase(l.ativo.departamento) : "—",
      l.centroCusto || "NÃO MAPEADO",
      l.mensalidade, l.iof, l.coparticipacaoMes, l.total,
    ];
    vals.forEach((v,i)=> ws.getCell(r, FIRST_COL+i).value = v);
    [5,6,7,8].forEach(i=> ws.getCell(r, FIRST_COL+i).numFmt = '#,##0.00');
    styleExportDataRow(ws, r, FIRST_COL, lastCol, idx%2===1);
    if(!l.centroCusto){
      ws.getCell(r, CC_COL).font = {name:EXPORT_FONT, size:10, italic:true, color:{argb:"FFB2544B"}};
      if(centrosDisponiveis.length){
        ws.getCell(r, CC_COL).dataValidation = {
          type: "list", allowBlank: true,
          formulae: [`'Centros de Custo'!$A$1:$A$${centrosDisponiveis.length}`],
          showErrorMessage: true, errorStyle: "warning",
          error: "Escolha um centro de custo da lista.", errorTitle: "Centro de custo",
          showInputMessage: true,
          prompt: "Escolha o centro de custo pra rateio manual deste beneficiário.", promptTitle: "Sem mapeamento automático",
        };
      }
    }
  });
  r++;
  const totVals = ["","","","","TOTAL", totalMens, totalIof, totalCopart, totalGeral];
  totVals.forEach((v,i)=> ws.getCell(r, FIRST_COL+i).value = v);
  [5,6,7,8].forEach(i=> ws.getCell(r, FIRST_COL+i).numFmt = '#,##0.00');
  styleExportTotalsRow(ws, r, FIRST_COL, lastCol);
  if(temBoletos){
    r++;
    ws.getCell(r, FIRST_COL+4).value = "Boleto(s) da fatura";
    ws.getCell(r, FIRST_COL+8).value = totalBoletos;
    ws.getCell(r, FIRST_COL+8).numFmt = '#,##0.00';
    r++;
    ws.getCell(r, FIRST_COL+4).value = "Diferença";
    ws.getCell(r, FIRST_COL+8).value = diferenca;
    ws.getCell(r, FIRST_COL+8).numFmt = '#,##0.00';
    [r-1,r].forEach(rr=>{
      ws.getCell(rr, FIRST_COL+4).font = {name:EXPORT_FONT, size:9.5, color:{argb:EXPORT_SUBTITLE_TEXT}};
      ws.getCell(rr, FIRST_COL+8).font = {name:EXPORT_FONT, size:9.5, bold:true, color:{argb:EXPORT_SUBTITLE_TEXT}};
    });
  }

  return ws;
}
async function exportarBeneficiariosExcel(modulo){
  const comps = competenciasDisponiveis(modulo);
  const sel = state["_sel_"+modulo] || comps[comps.length-1];
  const filtro = state["_filtroEmpresa_"+modulo] || "";

  // Lista de todos os centros de custo conhecidos (mapa importado + os fixos das SPEs bundladas),
  // usada pra montar uma lista suspensa nas células "NÃO MAPEADO" — facilita o rateio manual desses
  // casos (normalmente gente sem cadastro de ativo, ex. já desligada) direto na planilha exportada,
  // sem precisar digitar o texto do centro de custo à mão. Compartilhada entre as duas abas.
  const centrosDisponiveis = [...new Set([
    ...Object.values(state.centroCustoMapa||{}),
    ...Object.values(CENTRO_CUSTO_FIXO_POR_EMPRESA_FATURA),
  ])].sort((a,b)=>a.localeCompare(b,"pt-BR"));

  const wb = new ExcelJS.Workbook();
  if(centrosDisponiveis.length){
    const wsAux = wb.addWorksheet("Centros de Custo");
    centrosDisponiveis.forEach((cc,i)=> wsAux.getCell(i+1,1).value = cc);
    wsAux.state = "veryHidden";
  }

  const wsAtual = montarSheetBeneficiarios(wb, modulo, sel, "Beneficiários", centrosDisponiveis);
  if(!wsAtual){ toast("Importe a fatura real (PDF) deste mês antes de exportar.", true); return; }

  // Aba da competência anterior junto, pra manter o histórico completo ao longo dos meses — pedido
  // do usuário ("quero que na planilha extraída venha a da última competência em aba separada").
  const idxSel = comps.indexOf(sel);
  const compAnterior = idxSel > 0 ? comps[idxSel-1] : null;
  if(compAnterior) montarSheetBeneficiarios(wb, modulo, compAnterior, `Beneficiários ${mesLabelCurto(compAnterior).replace("/","-")}`, centrosDisponiveis);

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  await saveFile(`beneficiarios_${modulo}_${sel}${filtro?"_"+normName(filtro).replace(/\s+/g,"_"):""}.xlsx`, blob);
}
function titleCase(s){
  return (s||"").toLowerCase().replace(/(^|\s)([a-zà-ú])/g, (m,sp,c)=>sp+c.toUpperCase());
}
function fmtCompetencia(c){
  const [y,m] = c.split("-");
  const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  return `${meses[parseInt(m,10)-1]}/${y}`;
}

function bindView(){
  const fa = document.getElementById("fileAtivos");
  if(fa) fa.onchange = async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    e.target.value = "";
    try{

      openAtivosCompetenciaModal(file, ativos);
    }catch(err){ toast(err.message, true); }
  };
  document.querySelectorAll("[data-ativos-comp]").forEach(btn=>{

  });

  if(fh) fh.onchange = async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const r = await importarHistoricoCoparticipacao(file);
      toast(`${r.mesesImportados} mês(es) importado(s) da planilha (${r.linhasImportadas} linhas)${r.parcelasAplicadas?`, ${r.parcelasAplicadas} parcela(s) aplicada(s) em meses com fatura real`:""}.`);
      render();

  };
  const fs = document.getElementById("fileSubfaturas");

    const file = e.target.files[0]; if(!file) return;
    try{
      const n = await importarSubfaturas(file);
      toast(`${n} empresas mapeadas para suas subfaturas.`);
      render();
    }catch(err){ toast(err.message, true); }
  };
  const fcc = document.getElementById("fileCentroCusto");
  if(fcc) fcc.onchange = async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const n = await importarCentroCustos(file);
      toast(`Mapa de centro de custo importado: ${n} combinações empresa+departamento.`);
      render();
    }catch(err){ toast(err.message, true); }
  };
  const btnExport = document.getElementById("btnExportBenef");
  if(btnExport) btnExport.onclick = async ()=>{
    try{ await exportarBeneficiariosExcel(activeView); }
    catch(err){ toast(err.message, true); }
  };
  ["saude","odonto"].forEach(modulo=>{
    const inp = document.getElementById("fileFatura_"+modulo);

      const files = [...e.target.files];

        try{
          const parsed = await parseFaturaFile(files[0]);
          openCompetenciaModal(modulo, files[0], parsed);
        }catch(err){ toast(err.message, true); }
        return;
      }
      // vários arquivos de uma vez: detecta o mês de cada um sozinho, sem perguntar um por um

        }catch(err){ falhas.push(err.message); }

  document.querySelectorAll("[data-comp]").forEach(btn=>{

  document.querySelectorAll("[data-resolve]").forEach(btn=>{

      toast(msgs[status] || "Salvo.");
      render();
    };
  });
  document.querySelectorAll("[data-undo-resolve]").forEach(btn=>{
    btn.onclick = ()=>{
      const nomeNorm = decodeURIComponent(btn.dataset.undoResolve);
      delete state.nomeResolucoes[nomeNorm];

      toast("Decisão desfeita — volta a aparecer para confirmação se ainda houver divergência.");
      render();
    };

  document.querySelectorAll("[data-empresa-ciente]").forEach(btn=>{

      marcarDivergenciaEmpresaCiente(nomeNorm);
      toast("Marcado como ciente — não alerta mais essa divergência de empresa.");
      render();
    };
  });
  document.querySelectorAll("[data-undo-empresa]").forEach(btn=>{
    btn.onclick = ()=>{
      const nomeNorm = decodeURIComponent(btn.dataset.undoEmpresa);
      delete state.empresaIgnoradas[nomeNorm];
      persistResolucoes();
      toast("Decisão desfeita — a divergência de empresa volta a ser alertada.");
      render();
    };
  });
}

function openAtivosCompetenciaModal(file, ativos){
  const now = new Date();
  const def = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  document.getElementById("modalRoot").innerHTML = `
  <div class="modal-bg" id="mbg">
    <div class="modal" style="max-width:420px">
      <span class="modal-close" id="mclose">&times;</span>
      <h3>Competência deste cadastro de ativos</h3>
      <p class="mhint">${file.name} — ${ativos.length} funcionário(s). Qual mês esse cadastro representa? As faturas desse mês em diante vão usar esse cadastro até você importar um mais novo.</p>
      <div style="margin:16px 0 20px">
        <label style="display:block;font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Mês/ano deste cadastro</label>
        <input type="month" id="ativosCompInput" value="${def}" style="width:100%">
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button class="btn ghost" id="ativosCompCancel">Cancelar</button>
        <button class="btn primary" id="ativosCompConfirm">Importar cadastro</button>
      </div>
    </div>
  </div>`;
  const close = ()=> closeModal();
  document.getElementById("mbg").onclick = e=>{ if(e.target.id==="mbg") close(); };
  document.getElementById("mclose").onclick = close;
  document.getElementById("ativosCompCancel").onclick = close;
  document.getElementById("ativosCompConfirm").onclick = ()=>{
    const comp = document.getElementById("ativosCompInput").value;
    if(!/^\d{4}-\d{2}$/.test(comp||"")){ toast("Escolha um mês/ano válido.", true); return; }
    const n = salvarAtivos(comp, file, ativos);
    state["_selAtivosComp"] = comp;
    close();
    toast(`${n} funcionários ativos importados para ${fmtCompetencia(comp)}.`);
    render();
  };
}

/* ============================================================
   BANCO DE DADOS COMPARTILHADO (Firestore)
   Mesmo padrão do Apontamento Diário: tenta primeiro o banco do
   claude.ai (só relevante se este artefato for aberto lá — como
   a capability "db" não é declarada neste artefato, isso sempre
   cai pro Firebase, inclusive na própria cópia do claude.ai, pra
   nunca bifurcar dados entre as duas hospedagens), senão conecta
   direto no Firebase (funciona tanto ali quanto na cópia hospedada
   no GitHub Pages), e só cai pro localStorage puro se nenhum dos
   dois estiver disponível (dados ficam só neste navegador nesse
   caso, com aviso na tela).
   Projeto Firebase dedicado ("plano-saude-rioave"), regras abertas
   (allow read, write: if true) — mesmo nível "freio casual" da
   senha de entrada, não é segurança real; decisão consciente do
   usuário (ver memória do projeto), replicando o Apontamento Diário.
============================================================ */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCPbP7uLoSs7QCOJO05Xd8H7jTKN7bBQkk",
  authDomain: "plano-saude-rioave.firebaseapp.com",
  projectId: "plano-saude-rioave",
  storageBucket: "plano-saude-rioave.firebasestorage.app",
  messagingSenderId: "409982151743",
  appId: "1:409982151743:web:bddf4f43ec780f56561c8a"
};
function makeFirebaseDb(){
  if(typeof firebase === "undefined" || !firebase.apps) return null;
  var app = firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(FIREBASE_CONFIG);
  var fs = firebase.firestore(app);
  function wrapDoc(d){ return {id:d.id, exists:d.exists, data:function(){ return d.data(); }}; }
  function wrapSnapshot(snap){ return {docs: snap.docs.map(wrapDoc), size:snap.size, empty:snap.empty}; }
  return {
    collection: function(path){
      var ref = fs.collection(path);
      return {
        onSnapshot: function(next, err){ return ref.onSnapshot(function(snap){ next(wrapSnapshot(snap)); }, err); },
        doc: function(id){
          var dref = ref.doc(id);
          return {
            id:id,
            get: function(){ return dref.get().then(wrapDoc); },
            set: function(data){ return dref.set(data); },
            update: function(data){ return dref.update(data); },
            delete: function(){ return dref.delete(); }
          };
        }
      };
    }
  };
}
function makeLocalStorageDb(){
  var PREFIX = "planoSaudeRioAve-db:";
  var listeners = {};
  function readCollection(path){
    try{ var raw = localStorage.getItem(PREFIX+path); return raw ? JSON.parse(raw) : {}; }
    catch(e){ return {}; }
  }
  function writeCollection(path, docsObj){
    try{ localStorage.setItem(PREFIX+path, JSON.stringify(docsObj)); }catch(e){}
  }
  function notify(path){
    var docsObj = readCollection(path);
    var snap = {
      docs: Object.keys(docsObj).map(function(id){ return {id:id, exists:true, data:function(){ return docsObj[id]; }}; }),
      size: Object.keys(docsObj).length, empty: Object.keys(docsObj).length===0
    };
    (listeners[path]||[]).slice().forEach(function(cb){ cb(snap); });
  }
  return {
    collection: function(path){
      return {
        onSnapshot: function(next){
          listeners[path] = listeners[path]||[];
          listeners[path].push(next);
          notify(path);
          return function(){ listeners[path] = (listeners[path]||[]).filter(function(cb){ return cb!==next; }); };
        },
        doc: function(id){
          return {
            id:id,
            get: function(){
              var docsObj = readCollection(path);
              var exists = Object.prototype.hasOwnProperty.call(docsObj, id);
              return Promise.resolve({id:id, exists:exists, data:function(){ return docsObj[id]; }});
            },
            set: function(data){
              var docsObj = readCollection(path);
              docsObj[id] = JSON.parse(JSON.stringify(data));
              writeCollection(path, docsObj); notify(path);
              return Promise.resolve();
            },
            update: function(data){
              var docsObj = readCollection(path);
              docsObj[id] = Object.assign({}, docsObj[id]||{}, JSON.parse(JSON.stringify(data)));
              writeCollection(path, docsObj); notify(path);
              return Promise.resolve();
            },
            delete: function(){
              var docsObj = readCollection(path);
              delete docsObj[id];
              writeCollection(path, docsObj); notify(path);
              return Promise.resolve();
            }
          };
        }
      };
    }
  };
}
function showDbBanner(msg){
  const el = document.getElementById("dbBanner");
  if(el){ el.hidden = false; el.textContent = msg; }
}
function connectDb(){
  return new Promise(function(resolve){
    function fallbackParaFirebaseOuLocal(){
      var fbDb = null;
      try{ fbDb = makeFirebaseDb(); }catch(e){ fbDb = null; }
      if(fbDb){
        state.db = fbDb;
      } else {
        state.db = makeLocalStorageDb();
        showDbBanner("Não consegui conectar ao banco compartilhado — os dados ficam só neste navegador, não são vistos por outras pessoas.");
      }
      resolve(state.db);
    }
    if(window.claude && window.claude.use){
      window.claude.use("db").then(function(db){
        if(!db) fallbackParaFirebaseOuLocal();
        else { state.db = db; resolve(state.db); }
      });
    } else {
      fallbackParaFirebaseOuLocal();
    }
  });
}
let autenticado = false;
function renderSeAutenticado(){ if(autenticado) render(); }
function subscribeDb(db){
  db.collection("ativosSnapshots").onSnapshot(function(snap){
    const out = {};
    snap.docs.forEach(d=>{ out[d.id] = d.data(); });
    state.ativosPorCompetencia = out;
    renderSeAutenticado();
  });
  db.collection("faturas").onSnapshot(function(snap){
    const saude = {}, odonto = {};
    snap.docs.forEach(d=>{
      const data = d.data();
      const modulo = d.id.indexOf("odonto_")===0 ? "odonto" : "saude";
      (modulo==="odonto" ? odonto : saude)[data.competencia] = data;
    });
    state.modulos.saude.faturas = saude;
    state.modulos.odonto.faturas = odonto;
    renderSeAutenticado();
  });
  db.collection("config").onSnapshot(function(snap){
    snap.docs.forEach(d=>{
      const data = d.data();
      if(d.id==="resolucoes"){
        state.nomeResolucoes = data.nomeResolucoes||{};
        state.empresaIgnoradas = data.empresaIgnoradas||{};
      } else if(d.id==="subfaturas"){
        // Formato antigo (antes do mapa virar por módulo) salvava um objeto plano código->subfatura,
        // sempre referente à Saúde — se ainda vier assim (dado migrado do localStorage antes desta
        // mudança), embrulha como {saude:..., odonto:{}} em vez de perder o que já foi importado.
        const sub = data.subfaturasPorCodigo || {};
        const formatoAntigo = Object.keys(sub).length && !("saude" in sub) && !("odonto" in sub);
        state.subfaturasPorCodigo = formatoAntigo ? {saude: sub, odonto: {}} : {saude: sub.saude||{}, odonto: sub.odonto||{}};
        state.subfaturasArquivo = data.subfaturasArquivo||null;
        state.subfaturasImportadoEm = data.subfaturasImportadoEm||null;
      } else if(d.id==="centroCusto"){
        state.centroCustoMapa = data.centroCustoMapa||{};
        state.centroCustoArquivo = data.centroCustoArquivo||null;
        state.centroCustoImportadoEm = data.centroCustoImportadoEm||null;
      }
    });
    renderSeAutenticado();
  });
}

/* ---- gravação: cada função de mutação persiste só o documento que mudou,
   no lugar do antigo saveState() único (que serializava o state inteiro) ---- */
function persistAtivos(competencia){
  if(!state.db) return;
  state.db.collection("ativosSnapshots").doc(competencia).set(state.ativosPorCompetencia[competencia])
    .catch(()=> toast("Não consegui salvar no banco compartilhado — tente de novo.", true));
}
function persistFatura(modulo, competencia){
  if(!state.db) return;
  state.db.collection("faturas").doc(`${modulo}_${competencia}`).set(state.modulos[modulo].faturas[competencia])
    .catch(()=> toast("Não consegui salvar no banco compartilhado — tente de novo.", true));
}
function persistResolucoes(){
  if(!state.db) return;
  state.db.collection("config").doc("resolucoes").set({nomeResolucoes: state.nomeResolucoes, empresaIgnoradas: state.empresaIgnoradas})
    .catch(()=> toast("Não consegui salvar no banco compartilhado — tente de novo.", true));
}
function persistSubfaturas(){
  if(!state.db) return;
  state.db.collection("config").doc("subfaturas").set({subfaturasPorCodigo: state.subfaturasPorCodigo, subfaturasArquivo: state.subfaturasArquivo, subfaturasImportadoEm: state.subfaturasImportadoEm})
    .catch(()=> toast("Não consegui salvar no banco compartilhado — tente de novo.", true));
}
function persistCentroCusto(){
  if(!state.db) return;
  state.db.collection("config").doc("centroCusto").set({centroCustoMapa: state.centroCustoMapa, centroCustoArquivo: state.centroCustoArquivo, centroCustoImportadoEm: state.centroCustoImportadoEm})
    .catch(()=> toast("Não consegui salvar no banco compartilhado — tente de novo.", true));
}

/* ---- migração única: se este navegador tem dados do formato antigo
   (localStorage de antes do banco compartilhado) e o banco ainda está
   vazio, sobe esses dados pro Firestore uma vez só. Nunca sobrescreve
   se o banco já tiver algo (outra pessoa/aba já usou/migrou primeiro). ---- */
function probeCollectionOnce(db, path){
  return new Promise(resolve=>{
    const unsub = db.collection(path).onSnapshot(snap=>{ unsub(); resolve(snap); });
  });
}
async function migrarDadosLocaisSeNecessario(db){
  if(localStorage.getItem("planoSaudeRioAve:migrado")) return;
  const legado = loadLegacyLocalState();
  if(!legado){ localStorage.setItem("planoSaudeRioAve:migrado", "1"); return; }
  try{
    const [probeAtivos, probeFaturas] = await Promise.all([
      probeCollectionOnce(db, "ativosSnapshots"),
      probeCollectionOnce(db, "faturas"),
    ]);
    if(!probeAtivos.empty || !probeFaturas.empty){
      localStorage.setItem("planoSaudeRioAve:migrado", "1");
      return;
    }
    let ativosPorCompetencia = legado.ativosPorCompetencia || {};
    if(!Object.keys(ativosPorCompetencia).length && legado.ativos && legado.ativos.length){
      const hoje = new Date();
      const comp = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}`;
      ativosPorCompetencia = {[comp]: {ativos: legado.ativos, arquivo: legado.ativosArquivo||null, importadoEm: legado.ativosImportadoEm||new Date().toISOString()}};
    }
    const writes = [];
    for(const [comp, dados] of Object.entries(ativosPorCompetencia)){
      writes.push(db.collection("ativosSnapshots").doc(comp).set(dados));
    }
    const modulos = legado.modulos || {saude:{faturas:{}}, odonto:{faturas:{}}};
    for(const modulo of ["saude","odonto"]){
      for(const [comp, fatura] of Object.entries((modulos[modulo]||{}).faturas || {})){
        writes.push(db.collection("faturas").doc(`${modulo}_${comp}`).set(fatura));
      }
    }
    if(legado.nomeResolucoes || legado.empresaIgnoradas){
      writes.push(db.collection("config").doc("resolucoes").set({nomeResolucoes: legado.nomeResolucoes||{}, empresaIgnoradas: legado.empresaIgnoradas||{}}));
    }
    if(legado.subfaturasPorCodigo){
      writes.push(db.collection("config").doc("subfaturas").set({subfaturasPorCodigo: legado.subfaturasPorCodigo, subfaturasArquivo: legado.subfaturasArquivo||null, subfaturasImportadoEm: legado.subfaturasImportadoEm||null}));
    }
    if(legado.centroCustoMapa){
      writes.push(db.collection("config").doc("centroCusto").set({centroCustoMapa: legado.centroCustoMapa, centroCustoArquivo: legado.centroCustoArquivo||null, centroCustoImportadoEm: legado.centroCustoImportadoEm||null}));
    }
    await Promise.all(writes);
    localStorage.setItem("planoSaudeRioAve:migrado", "1");
  }catch(e){
    // não marca como migrado se falhar — tenta de novo na próxima carga
  }
}

/* ============================================================
   ACESSO — senha simples (não é segurança real: qualquer pessoa com
   acesso ao devtools do navegador consegue contornar isso; é só um
   filtro casual, dado o dado sensível que essa ferramenta guarda).
   Pedido do usuário: sempre pedir a senha (sem "lembrar" entre
   sessões), hash SHA-256 em vez de senha em texto puro no código-fonte.
============================================================ */
const SENHA_HASH = "952dc2d36c52ec57a021941595ad98dc7bdceae62d92e9850aad8e926b7daaf3";
async function sha256Hex(texto){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texto));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function tentarAcesso(){
  const input = document.getElementById("authInput");
  const hash = await sha256Hex(input.value);
  if(hash === SENHA_HASH){
    document.getElementById("authGate").remove();
    document.getElementById("appShell").style.display = "";
    autenticado = true;
    render();
  } else {
    document.getElementById("authError").style.display = "block";
    input.value = "";
    input.focus();
  }
}
document.getElementById("authSubmit").onclick = tentarAcesso;
document.getElementById("authInput").addEventListener("keydown", e=>{ if(e.key==="Enter") tentarAcesso(); });
document.getElementById("authInput").focus();

// Conecta ao banco assim que o script carrega, em paralelo com a tela de senha (a senha aqui é
// única/fixa, não depende de nada do banco pra ser conferida) — precisa ficar no fim do script,
// depois de FIREBASE_CONFIG já ter sido atribuído (ver nota no Apontamento Diário sobre chamar
// isso cedo demais e o Firebase falhar com "Need to provide options").
state.dbReady = connectDb();
state.dbReady.then(function(db){
  subscribeDb(db);
  migrarDadosLocaisSeNecessario(db);
});
</script>
